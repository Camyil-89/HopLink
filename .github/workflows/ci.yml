name: CI and releases

on:
  push:
    branches: [dev, main]
    paths:
      - 'internal/**'
      - 'cmd/hoplink/**'
      - 'cmd/desktop/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build-desktop.mjs'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/hoplink/**'
      - 'cmd/desktop/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/build-desktop.mjs'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      hoplink: ${{ steps.changes.outputs.hoplink }}
      desktop: ${{ steps.changes.outputs.desktop }}
      hoplink_version: ${{ steps.changes.outputs.hoplink_version }}
      desktop_version: ${{ steps.changes.outputs.desktop_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all release tags
        run: git fetch --tags origin
      - id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'push' && '${{ github.ref_name }}' == 'main' ]]; then
            base='${{ github.event.before }}'
            if [[ "$base" == '0000000000000000000000000000000000000000' ]]; then
              files=$(git ls-files)
            else
              files=$(git diff --name-only "$base" HEAD)
            fi
            hoplink=false
            desktop=false
            if grep -Eq '^(internal/hoplink/|cmd/hoplink/|go\.(mod|sum)$|\.github/workflows/ci\.yml$)' <<< "$files"; then hoplink=true; fi
            if grep -Eq '^(internal/desktop/|cmd/desktop/|scripts/build-desktop\.mjs$|go\.(mod|sum)$|\.github/workflows/ci\.yml$)' <<< "$files"; then desktop=true; fi
          else
            hoplink=false
            desktop=false
          fi
          next_release_version() {
            local latest major minor patch
            latest=$(git tag -l 'hoplink-v*' 'desktop-hoplink-v*' | sed -nE 's/^(hoplink|desktop-hoplink)-v([0-9]+\.[0-9]+\.[0-9]+)$/\2/p' | sort -V | tail -n 1)
            latest=${latest:-0.0.0}
            IFS=. read -r major minor patch <<< "$latest"
            printf '%s.%s.%s' "$major" "$minor" "$((patch + 1))"
          }
          version=$(next_release_version)
          {
            echo "hoplink=$hoplink"
            echo "desktop=$desktop"
            echo "hoplink_version=$version"
            echo "desktop_version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            component: hoplink
          - os: ubuntu-22.04
            component: desktop-hoplink
          - os: windows-2022
            component: desktop-hoplink
          - os: macos-15
            component: desktop-hoplink
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.component == 'desktop-hoplink' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - uses: actions/setup-node@v4
        if: matrix.component == 'desktop-hoplink'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/desktop/frontend/package-lock.json
      - name: Install Wails CLI
        if: matrix.component == 'desktop-hoplink'
        shell: pwsh
        run: |
          $wailsBin = Join-Path $env:RUNNER_TEMP 'wails-bin'
          New-Item -ItemType Directory -Force $wailsBin | Out-Null
          $env:GOBIN = $wailsBin
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $wailsBin
      - name: Test Go packages
        if: matrix.component == 'hoplink'
        run: go test ./cmd/hoplink ./internal/hoplink
      - name: Build service
        if: matrix.component == 'hoplink'
        shell: pwsh
        env:
          HOPLINK_VERSION: ${{ needs.versions.outputs.hoplink_version }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $platformName = if ($IsMacOS) { 'Darwin' } else { $env:RUNNER_OS }
          $binaryName = if ($IsLinux) { 'deploy/hoplink-Linux-amd64' } else { "deploy/hoplink-$platformName$suffix" }
          go build -ldflags "-X main.version=$env:HOPLINK_VERSION" -o $binaryName ./cmd/hoplink
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) {
            $env:GOARCH = 'arm64'
            $env:CGO_ENABLED = '0'
            go build -ldflags "-X main.version=$env:HOPLINK_VERSION" -o deploy/hoplink-Linux-arm64 ./cmd/hoplink
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build desktop
        if: matrix.component == 'desktop-hoplink'
        env:
          DESKTOP_VERSION: ${{ needs.versions.outputs.desktop_version }}
        run: node scripts/build-desktop.mjs
      - name: Package binary
        shell: pwsh
        env:
          COMPONENT: ${{ matrix.component }}
          HOPLINK_VERSION: ${{ needs.versions.outputs.hoplink_version }}
          DESKTOP_VERSION: ${{ needs.versions.outputs.desktop_version }}
        run: |
          $platform = if ($IsMacOS) { 'darwin' } elseif ($IsWindows) { 'windows' } else { 'linux' }
          if ($env:COMPONENT -eq 'hoplink') {
            $source = 'deploy/hoplink-Linux-amd64'
          } else {
            $source = if ($IsWindows) { 'deploy/HopLink.exe' } elseif ($IsMacOS) { 'deploy/bin/hoplink-desktop.app' } else { 'deploy/HopLink' }
          }
          if (-not (Test-Path -LiteralPath $source)) { throw "Expected build output missing: $source" }
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "release/$env:COMPONENT-$platform.zip"
          $archivePath = Join-Path (Resolve-Path release).Path "$env:COMPONENT-$platform.zip"
          if ($env:COMPONENT -eq 'desktop-hoplink') {
            New-Item -ItemType Directory -Force package/deploy, package/cmd, package/internal | Out-Null
            Copy-Item -LiteralPath $source -Destination package/deploy -Recurse
            Copy-Item -LiteralPath cmd/hoplink -Destination package/cmd -Recurse
            Copy-Item -LiteralPath internal/hoplink -Destination package/internal -Recurse
            Copy-Item -LiteralPath go.mod,go.sum -Destination package
            if ($IsWindows) {
              Compress-Archive -Path package/* -DestinationPath $archive
            } else {
              Push-Location package
              zip -qry $archivePath .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Pop-Location
            }
          } else {
            if ($IsLinux) {
              zip -j $archivePath $source deploy/hoplink-Linux-arm64
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } elseif ($IsMacOS) {
              zip -j $archivePath $source
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else {
              Compress-Archive -LiteralPath $source -DestinationPath $archive
            }
          }
          if ($env:COMPONENT -eq 'hoplink') {
            Copy-Item -LiteralPath $source -Destination 'release/hoplink-Linux-amd64'
            Copy-Item -LiteralPath 'deploy/hoplink-Linux-arm64' -Destination 'release/hoplink-Linux-arm64'
          } elseif ($IsWindows) {
            Copy-Item -LiteralPath $source -Destination 'release/desktop-hoplink-windows.exe'
          } elseif ($IsMacOS) {
            $plist = Join-Path $source 'Contents/Info.plist'
            $executableName = & /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' $plist
            if ($LASTEXITCODE -ne 0) { throw 'Could not read CFBundleExecutable from the macOS app bundle' }
            $macExecutable = Join-Path (Join-Path $source 'Contents/MacOS') $executableName
            if (-not (Test-Path -LiteralPath $macExecutable)) { throw "Expected macOS executable missing: $macExecutable" }
            Copy-Item -LiteralPath $macExecutable -Destination 'release/desktop-hoplink-darwin'
            Copy-Item -LiteralPath $source -Destination 'release/desktop-hoplink-darwin.app' -Recurse
          } else {
            Copy-Item -LiteralPath $source -Destination 'release/desktop-hoplink-linux'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ runner.os }}
          path: release/**
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_name == 'main' && (needs.versions.outputs.hoplink == 'true' || needs.versions.outputs.desktop == 'true')
    needs: [versions, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.versions.outputs.hoplink_version }}
        run: |
          set -euo pipefail
          mapfile -d '' -t assets < <(find release -maxdepth 1 -type f -print0)
          gh release create "hoplink-v$VERSION" "${assets[@]}" --target "$GITHUB_SHA" --title "HopLink v$VERSION" --generate-notes
